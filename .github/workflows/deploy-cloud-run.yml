# push で apps/hello-cloud-run を Cloud Run に自動デプロイする雛形（課題4）
#
# 有効化の手順:
# 1. Workload Identity Federation を設定し、GitHub Actions 用のサービスアカウントを作る
#    （Claude Code に「WIF を設定して」と頼めばコマンドを出してくれる）
# 2. リポジトリの Settings > Secrets に以下を登録
#    GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT
# 3. 下の `if: false` を外す

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths: ["apps/hello-cloud-run/**"]

jobs:
  deploy:
    if: false   # 課題4で有効化
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud run deploy hello-cloud-run \
            --source apps/hello-cloud-run \
            --region asia-northeast1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --allow-unauthenticated
